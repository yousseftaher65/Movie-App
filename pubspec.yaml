  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  google_sign_in: ^7.2.0
  easy_localization: ^3.0.8
